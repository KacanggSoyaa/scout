[workspace]
resolver = "2"
members = ["crates/scout-core", "crates/scout", "crates/scout-convert"]
default-members = ["crates/scout", "crates/scout-convert"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
termcolor = "1"
scout-core = { path = "crates/scout-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
